# Shema portova za sve lokalne Docker aplikacije: web 30xx, API 80xx, baza 54xx (xx = broj aplikacije).
# habit-tracker = 30: web 3030 (i s kućne mreže), API 127.0.0.1:8030, baza 127.0.0.1:5430.

services:
  postgres:
    mem_limit: 512m
    image: postgres:16-alpine
    container_name: habit-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-habit_tracker}
      POSTGRES_USER: ${DB_USER:-habit_tracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Postavi DB_PASSWORD u .env (vidi .env.example)}
    ports:
      - "127.0.0.1:${DB_PORT:-5430}:5432"
    volumes:
      - habit_tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-habit_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    build:
      context: ./backend
    container_name: habit-tracker-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-habit_tracker}
      DB_USER: ${DB_USER:-habit_tracker}
      DB_PASSWORD: ${DB_PASSWORD:?Postavi DB_PASSWORD u .env (vidi .env.example)}
      JWT_SECRET: ${JWT_SECRET:?Postavi JWT_SECRET u .env (openssl rand -hex 32)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3030}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8030}:8080"

  frontend:
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    build:
      context: ./frontend
    container_name: habit-tracker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3030}:80"

volumes:
  habit_tracker_pgdata:
